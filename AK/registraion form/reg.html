<!DOCTYPE html>
<html>
<head>
<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 30px;
    }

    h3 {
      text-align: center;
      color: #333;
    }

    .card {
      width: 300px;
      margin: 15px auto;
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      display: block;
      margin: 25px auto;
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</style>

</head>
<body>
<h3>Regsitration form</h3>
<div class="card">
	<label>Full Name</label>
	<input type="text" placeholder="Full name" required>
</div>
<div class="card">
	<label>E-mail</label>
	<input type="e-mail" placeholder="e-mail" required>
</div>
<div class="card">
	<label>Password</label>
	<input type="password" placeholder="create a password" required>
</div>
<div class="card">
	<label>confirm password</label>
	<input type="confirmpassword" placeholder="confirm your password" required>
</div>
<button type="submit">SUBMIT</button>
</body>
</html>
