<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
 
    <style>
        .internal-style {
            color: darkgreen;
            font-size: 22px;
            padding: 10px;
            border: 2px solid darkgreen;
        }

        .box {
            background-color: #f2f2f2;
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Different CSS Styling Methods</h1>
    <p style="color: red; font-weight: bold;">
        This paragraph uses inline CSS.
    </p>

    <p class="internal-style">
        This paragraph uses internal CSS.
    </p>

    <p class="external-style">
        This paragraph uses external CSS.
    </p>

    <div class="box">
        This box receives styling from internal CSS.
    </div>

</body>
</html>
